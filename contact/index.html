    <p class="intro">Email is the way to reach me.</p>

  <script>
    (function () {
      var topics = { role: "Full-time role", project: "One-off project" };
      var topic = new URLSearchParams(location.search).get("topic");
      var label = topics[topic];
      var link = document.getElementById("mailto");
      var note = document.getElementById("topic-note");
      if (!label || !link) return;
      link.href = link.getAttribute("href") + "?subject=" + encodeURIComponent(label);
      if (note) note.textContent = "The subject line is set to \"" + label + ".\"";
    })();
  </script>
